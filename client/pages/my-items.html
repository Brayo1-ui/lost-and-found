<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Items | Lost & Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
      }
      header {
        background: #4f46e5;
        color: white;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 20px;
      }
      header button {
        background: white;
        color: #4f46e5;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
      }
      h2 {
        margin-bottom: 24px;
        color: #333;
      }
      .items-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      .item-card {
        background: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .item-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .item-card h3 {
        font-size: 16px;
        margin-bottom: 8px;
        color: #333;
      }
      .item-card p {
        font-size: 14px;
        color: #666;
        margin-bottom: 6px;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .badge.lost {
        background: #fee2e2;
        color: #dc2626;
      }
      .badge.found {
        background: #dcfce7;
        color: #16a34a;
      }
      .badge.resolved {
        background: #e0e7ff;
        color: #4f46e5;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .btn-resolve {
        flex: 1;
        background: #16a34a;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-delete {
        flex: 1;
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      .no-items {
        text-align: center;
        color: #999;
        margin-top: 60px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <script>
      if (!localStorage.getItem("token")) {
        window.location.replace("login.html");
      }
    </script>

    <header>
      <h1>My Items</h1>
      <button onclick="logout()">Logout</button>
    </header>

    <div class="container">
      <h2>Your Reported Items</h2>
      <div class="items-grid" id="items-grid">
        <p class="no-items">Loading your items...</p>
      </div>
    </div>

    <script>
      const API = "https://lost-and-found-api-bvxg.onrender.com";

      // Load user's items
      async function loadMyItems() {
        const token = localStorage.getItem("token");
        const response = await fetch(`${API}/api/items?user=me`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const items = await response.json();
        const grid = document.getElementById("items-grid");

        if (!items.length) {
          grid.innerHTML =
            '<p class="no-items">You have not reported any items yet.</p>';
          return;
        }

        grid.innerHTML = items
          .map(
            (item) => `
        <div class="item-card">
          ${item.image ? `<img src="${API}/uploads/${item.image}" alt="${item.name}" />` : ""}
          <span class="badge ${item.status === "resolved" ? "resolved" : item.type}">
            ${item.status === "resolved" ? "RESOLVED" : item.type.toUpperCase()}
          </span>
          <h3>${item.name}</h3>
          <p>📍 ${item.location}</p>
          <p>🏷️ ${item.category}</p>
          <p>${item.description || ""}</p>
          ${
            item.status !== "resolved"
              ? `
          <div class="actions">
            <button class="btn-resolve" onclick="resolveItem('${item._id}')">Mark Resolved</button>
            <button class="btn-delete" onclick="deleteItem('${item._id}')">Delete</button>
          </div>`
              : '<p style="color:#4F46E5; margin-top:10px; font-size:13px;">✅ This item has been resolved</p>'
          }
        </div>
      `,
          )
          .join("");
      }

      async function resolveItem(id) {
        if (!confirm("Mark this item as resolved?")) return;
        const token = localStorage.getItem("token");
        const response = await fetch(`${API}/api/items/${id}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ status: "resolved" }),
        });
        const data = await response.json();
        if (response.ok) loadMyItems();
        else alert("Failed to update item.");
      }

      // Delete item
      async function deleteItem(id) {
        const token = localStorage.getItem("token");
        if (!confirm("Are you sure you want to delete this item?")) return;
        const response = await fetch(`${API}/api/items/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (response.ok) loadMyItems();
        else alert("Failed to delete item.");
      }

      // Logout
      function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.replace("login.html");
      }

      loadMyItems();
    </script>
  </body>
</html>
